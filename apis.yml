  date: '2026-08-03'
  method: probed
  note: Profiled ahead of a 2026-08-04 consultation. Every surface was fetched; nothing here is modelled
    on the provider's behalf. The negative findings below are the substance.
  findings:
  - surface: LlmsTxt
    url: https://graph8.com/llms.txt
    http_status: 200
    real: true
    note: 3.4KB, well structured.
  - surface: LlmsTxt
    url: https://docs.graph8.com/llms.txt
    http_status: 200
    real: true
    note: 46KB, 278 links, 15 dedicated developer pages.
  - surface: DeveloperPortal
    url: https://graph8.com/build/
    http_status: 200
    real: true
    note: 'Six documented surfaces: API, SDKs, CLI, MCP, components, infrastructure.'
  - surface: OpenAPI
    url: https://graph8.com/openapi.json
    http_status: 404
    real: false
    note: NO OpenAPI is published. 404 at /openapi.json, docs.graph8.com/openapi.json and /api-reference/openapi.json;
      api.graph8.com does not resolve. The /build/status page nonetheless advertises "REST + OpenAPI —
      Operational".
  - surface: OpenAPI
    url: https://graph8.com/api/openapi.json
    http_status: 200
    real: false
    note: FALSE POSITIVE — rejected. Returns 200 with 958,565 bytes of HTML that is BYTE-IDENTICAL (same
      md5) to the control path /api/zzz-control-nonsense. The entire /api/* tree is a single-page-app
      catch-all, so any probe under it reports a false success. The apex control /zzz-control-nonsense
      correctly 404s.
  - surface: MCPServer
    url: https://graph8.com/mcp
    http_status: 404
    real: false
    note: Marketed with named tools — search_contacts, enrich_company, read_signals — but no endpoint
      is publicly reachable.
  - surface: WellKnown
    url: https://graph8.com/.well-known/api-catalog
    http_status: 404
    real: false
