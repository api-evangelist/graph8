name: graph8
description: 'graph8 is an autonomous revenue system — an AI-native B2B sales platform that finds buyers,
  launches campaigns, runs conversations and builds pipeline against a single buyer graph. It spans buyer
  and intent data (a claimed 700M contacts and 100M companies), signals, a campaign studio, named agents,
  CRM and pipeline reporting, a built-in CDP with 500+ connectors, and a desktop companion. It is one
  of four brands under one company: graph8 the platform, graph8 build the developer platform, CIENCE the
  SDR and GTM services arm, and Tenbound the research magazine and community. The developer surface at
  graph8.com/build is documented across six areas — REST API, SDKs, CLI, MCP, React components and infrastructure
  — but is in preview: at the time of profiling no OpenAPI and no MCP endpoint were publicly fetchable,
  and a workspace endpoint is issued on request rather than self-serve.'
